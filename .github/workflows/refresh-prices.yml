name: Refresh prices

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-prices
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download TLD prices
        run: node scripts/refresh-prices.mjs

      - name: Commit and push when prices change
        env:
          TOKEN: ${{ secrets.PRICES_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PRICES_PUSH_TOKEN is not set."
            echo "Add a fine-grained PAT as that repository secret so this push notifies Vercel."
            exit 1
          fi
          git config user.name "tld-ltd prices"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "Prices unchanged."
            exit 0
          fi
          git commit -m "chore: refresh TLD prices"
          git push "https://x-access-token:${TOKEN}@github.com/pajarosis/tld-ltd.git" HEAD:main
